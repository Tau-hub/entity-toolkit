<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perk tier list · Entity Toolkit</title>
<style>
  .intro { color:var(--muted); font-size:13px; margin:0 0 14px; text-align:center; }
  .bar2 { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; align-items:center; margin:0 auto 16px; max-width:1100px; }
  .seg { display:inline-flex; border:1px solid var(--border); border-radius:999px; overflow:hidden; background:#0006; }
  .seg button { background:transparent; color:var(--muted); border:0; padding:7px 18px; font:inherit; font-size:14px; cursor:pointer; }
  .seg button.on { color:#fff; background:linear-gradient(180deg,#d1243a55,#7d0f1f55); }
  .bar2 select, .bar2 input[type=search] { padding:7px 14px; font-size:13.5px; }
  .bar2 label { color:var(--muted); font-size:13px; display:flex; gap:6px; align-items:center; cursor:pointer; }
  .tiers { max-width:1100px; margin:0 auto; display:grid; gap:8px; }
  .tier { display:grid; grid-template-columns:74px 1fr; background:var(--panel); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .tier .lab { display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:30px; font-weight:800; color:#12090b; padding:8px 4px; }
  .tier .lab small { font-size:10.5px; font-weight:600; letter-spacing:.06em; opacity:.8; }
  .tier.S .lab { background:#e0457b; } .tier.A .lab { background:#e8a33d; } .tier.B .lab { background:#d9d04a; }
  .tier.C .lab { background:#4aa3df; } .tier.D .lab { background:#7c8594; } .tier.N .lab { background:#3a3340; color:var(--muted); font-size:22px; }
  .tier .perks { display:flex; flex-wrap:wrap; gap:6px; padding:8px; align-content:flex-start; min-height:62px; }
  .p { position:relative; width:58px; height:58px; border-radius:10px; background:var(--panel2); border:1px solid transparent; cursor:help; padding:0; display:block; }
  .p:hover { border-color:var(--accent); }
  .p img { width:100%; height:100%; object-fit:contain; display:block; }
  .p.no { opacity:.4; } .p.dim { opacity:.15; }
  .p.hit { border-color:var(--gold); }
  .empty2 { color:var(--muted); font-size:12.5px; padding:14px 10px; }
  .tip { position:fixed; z-index:30; max-width:360px; background:#0e0b0dee; border:1px solid var(--red2); border-radius:10px; padding:10px 12px; font-size:13px; pointer-events:none; display:none; white-space:pre-line; box-shadow:0 8px 30px #000c; }
  .tip b { display:block; font-size:15px; } .tip i { display:block; color:var(--gold); font-style:normal; font-size:11px; letter-spacing:.12em; text-transform:uppercase; margin:1px 0 6px; }
  .tip .nums { color:var(--gold); }
  .legend { max-width:1100px; margin:14px auto 0; color:var(--muted); font-size:12px; text-align:center; }
  @media (max-width:640px) { .tier { grid-template-columns:50px 1fr; } .tier .lab { font-size:22px; } .p { width:50px; height:50px; } }
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<script src="nav.js"></script>
<header>
  <h1>Perk tier list</h1>
  <span class="patch" id="patch"></span>
</header>
<main>
  <p class="intro" id="intro"></p>
  <div class="bar2">
    <div class="seg" id="side"><button data-s="S" class="on">Survivor perks</button><button data-s="K">Killer perks</button></div>
    <select id="metric" title="What the tiers are based on">
      <option value="note">Combined rating (Otzdarva + NightLight)</option>
      <option value="otz">Otzdarva's opinion</option>
      <option value="pick">NightLight: pick rate</option>
      <option value="nlRate">NightLight: escape / kill rate</option>
    </select>
    <select id="type" title="Only perks of this kind"><option value="">All kinds of perks</option></select>
    <input type="search" id="q" placeholder="Find a perk or a character">
    <label><input type="checkbox" id="mine"> Only the perks I have</label>
  </div>
  <div class="tiers" id="app"></div>
  <p class="legend" id="legend"></p>
</main>
<div class="tip" id="tip"></div>
<script>
window.addEventListener("error", (e) => { document.getElementById("app").innerHTML = "<p class='empty2'>Error: " + e.message + "</p>"; });
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const LIMITS = [["S", 80], ["A", 65], ["B", 50], ["C", 25], ["D", 0]];  // a perk is in the first tier whose limit its score (out of 100) reaches
const METRIC_NAME = { note: "combined rating", otz: "Otzdarva's opinion", pick: "NightLight pick rate", nlRate: "NightLight escape / kill rate" };
let DATA = null, side = "S", tipFor = null;
try { side = localStorage.getItem("tier.side") || "S"; $("metric").value = localStorage.getItem("tier.metric") || "note"; } catch (e) {}

// Score out of 100 on which the tiers are cut. Combined rating: the rating itself. Otzdarva: his value (out of 999) on 100.
// NightLight (pick rate, escape / kill rate): where the perk stands among the perks of its side, 100 = the best, 0 = the worst.
function scoreOf(perks, m) {
  if (m === "note") return (p) => (typeof p.note === "number" ? p.note : null);
  if (m === "otz") return (p) => (typeof p.otz === "number" ? Math.round(p.otz / 10) : null);
  const v = perks.map((p) => p[m]).filter((x) => typeof x === "number").sort((a, b) => a - b);
  return (p) => (typeof p[m] === "number" && v.length > 1 ? Math.round((100 * v.filter((x) => x < p[m]).length) / (v.length - 1)) : null);
}
const stars = (n) => "★".repeat(n) + "☆".repeat(3 - n);
const tierOf = (s) => { for (const [t, lim] of LIMITS) if (s >= lim) return t; return "D"; };

function tipText(p, score) {
  const lines = [];
  lines.push(`<b>${esc(p.name)}</b><i>${side === "K" ? "Killer" : "Survivor"} perk${p.owner ? " · " + esc(p.owner) : " · general"}${p.have ? "" : " · not unlocked"}</i>`);
  const nums = [];
  if (score !== null) nums.push(`Tier score ${score}/100 (${METRIC_NAME[$("metric").value]})`);
  if (typeof p.note === "number") nums.push(`Rating ${p.note}/100`);
  if (typeof p.otz === "number") nums.push(`Otzdarva ${stars(p.stars || 0)} (${p.otz}/999)`);
  if (typeof p.pick === "number") nums.push(`NightLight: picked in ${p.pick} % of games`);
  if (typeof p.nlRate === "number") nums.push(`NightLight: ${p.nlRate} % ${DATA.labels[side] || "results"}`);
  lines.push(nums.length ? `<span class="nums">${nums.map(esc).join("\n")}</span>` : "Not rated yet");
  if (p.desc) lines.push("\n" + esc(String(p.desc).replace(/<[^>]+>/g, "").slice(0, 420)));
  return lines.join("\n");
}

function draw() {
  const m = $("metric").value, perks = DATA.perks[side] || [], sc = scoreOf(perks, m);
  const kind = $("type").value, q = $("q").value.trim().toLowerCase(), mine = $("mine").checked;
  const dimmed = (p) => (kind && !(p.types || []).includes(kind)) || (mine && !p.have);
  const found = (p) => q && (p.name.toLowerCase().includes(q) || String(p.owner || "").toLowerCase().includes(q));
  const groups = { S: [], A: [], B: [], C: [], D: [], N: [] };
  let n = 0;
  for (const p of perks) { const v = sc(p); if (v !== null) n++; groups[v === null ? "N" : tierOf(v)].push(p); }
  const byValue = (a, b) => (sc(b) ?? -1) - (sc(a) ?? -1) || (b[m] ?? 0) - (a[m] ?? 0) || a.name.localeCompare(b.name);
  const shown = (p) => !dimmed(p);
  const range = (k) => { const i = LIMITS.findIndex(([t]) => t === k); return k === "S" ? "80 – 100" : `${LIMITS[i][1]} – ${LIMITS[i - 1][1] - 1}`; };
  $("app").innerHTML = ["S", "A", "B", "C", "D", "N"].map((k) => {
    const list = groups[k].sort(byValue).filter(shown);
    if (k === "N" && !groups.N.length) return "";
    const tiles = list.map((p) => `<button class="p${p.have ? "" : " no"}${found(p) ? " hit" : ""}" data-n="${esc(p.name)}" aria-label="${esc(p.name)}"><img loading="lazy" src="${esc(p.icon)}" alt=""></button>`).join("");
    return `<div class="tier ${k}"><div class="lab">${k === "N" ? "?" : k}<small>${k === "N" ? "no data" : range(k)}</small></div><div class="perks">${tiles || '<span class="empty2">Nothing here with these filters.</span>'}</div></div>`;
  }).join("");
  $("legend").textContent = `${n} perks rated by ${METRIC_NAME[m]}. Tiers on a score out of 100: S 80 and more, A 65 – 79, B 50 – 64, C 25 – 49, D 0 – 24; perks without data are at the bottom.${m === "pick" || m === "nlRate" ? " For NightLight, the score is the perk's position among the perks of its side (100 = the best)." : ""} Dimmed perks do not match your filters; faded ones are not unlocked on your account yet.`;
  try { localStorage.setItem("tier.side", side); localStorage.setItem("tier.metric", m); } catch (e) {}
}

function fillTypes() {
  const sel = $("type"), cur = sel.value, list = (DATA.types || {})[side] || [];
  sel.innerHTML = '<option value="">All kinds of perks</option>' + list.map((t) => `<option value="${esc(t.id)}">${esc(t.label)}</option>`).join("");
  sel.value = list.some((t) => t.id === cur) ? cur : "";
}

function setSide(s) {
  side = s;
  document.querySelectorAll("#side button").forEach((b) => b.classList.toggle("on", b.dataset.s === s));
  fillTypes();
  draw();
}

document.addEventListener("mousemove", (e) => {
  const b = e.target.closest && e.target.closest(".p"), tip = $("tip");
  if (!b || !DATA) { tip.style.display = "none"; tipFor = null; return; }
  if (tipFor !== b) {
    tipFor = b;
    const p = (DATA.perks[side] || []).find((x) => x.name === b.dataset.n);
    const m = $("metric").value;
    tip.innerHTML = tipText(p, scoreOf(DATA.perks[side] || [], m)(p)).replace(/\n/g, "<br>");
    tip.style.display = "block";
  }
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(e.clientX + 16, innerWidth - w - 8) + "px";
  tip.style.top = Math.min(e.clientY + 16, innerHeight - h - 8) + "px";
});

(async function () {
  try {
    DATA = await fetch("/api/tierlist", { cache: "no-store" }).then((r) => r.json());
  } catch (e) { $("app").innerHTML = '<p class="empty2">Could not read the perk data.</p>'; return; }
  $("patch").textContent = patchLabel(DATA);
  if (!(DATA.perks.S || []).length && !(DATA.perks.K || []).length) {
    $("app").innerHTML = '<p class="empty2">No perk data yet: open Settings and press “Update database”.</p>';
    return;
  }
  $("intro").textContent = `Every perk of the game, ranked with Otzdarva's ratings and NightLight's statistics${DATA.nlPeriod ? " (" + DATA.nlPeriod + ")" : ""}. Hover a perk for its numbers.`;
  document.querySelectorAll("#side button").forEach((b) => b.addEventListener("click", () => setSide(b.dataset.s)));
  ["metric", "type", "mine"].forEach((id) => $(id).addEventListener("change", draw));
  $("q").addEventListener("input", draw);
  setSide(side === "K" ? "K" : "S");
})();
</script>
</body>
</html>
