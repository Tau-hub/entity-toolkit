<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Killer builds · Entity Toolkit</title>
<style>
:root{--bg:#0f1115;--panel:#181b22;--panel2:#20242d;--text:#e8e6e3;--muted:#9aa0ab;--accent:#c0392b;--border:#2b303b;
--t-strongest:#e0457b;--t-good:#e8a33d;--t-decent:#4aa3df;--t-almost-no-effect:#7c8594;--t-detrimental:#7d3c98}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:5;background:#0b0d11ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
header h1{font-size:18px;margin:0 8px 0 0}
header input,header select{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:15px}
header input{flex:1;min-width:260px;max-width:420px}
header select{min-width:200px}
.patch{color:var(--muted);font-size:12px;margin-left:auto}
main{max-width:1150px;margin:0 auto;padding:16px}
.empty{text-align:center;color:var(--muted);padding:60px 0}
.hero{display:flex;gap:18px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;align-items:flex-start;flex-wrap:wrap}
.hero img{width:130px;height:130px;object-fit:contain;background:var(--panel2);border-radius:12px}
.hero h2{margin:0 0 6px;font-size:26px}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:600;font-size:13px;margin-right:6px}
.d-easy{background:#1e6b3a}.d-mid{background:#9a7b12}.d-hard{background:#a5321f}.d-unk{background:#444}
.stats{color:var(--muted);margin:8px 0}
.hero p{margin:6px 0;max-width:720px;color:#cfcbc6}
h3{margin:28px 0 10px;font-size:19px;border-bottom:1px solid var(--border);padding-bottom:6px}
.builds{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.build{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px}
.build.best{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.build h4{margin:0 0 8px;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.star{background:var(--accent);color:#fff;border-radius:6px;font-size:11px;padding:2px 7px}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:999px;padding:7px 16px;cursor:pointer;font-size:14px}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.rk{background:var(--panel2);border-radius:6px;font-size:12px;padding:1px 8px;color:var(--muted)}
.bstats{display:flex;gap:14px;margin-top:10px;font-size:13px;color:var(--muted)}.bstats b{color:var(--text)}
.subline{color:var(--muted);font-size:13px;margin:0 0 10px}
.perks{display:flex;gap:8px;flex-wrap:wrap}
.perk{width:calc(25% - 6px);min-width:64px;text-align:center;font-size:11px;line-height:1.2;cursor:help}
.perk img{width:100%;max-width:72px;aspect-ratio:1;object-fit:contain;background:var(--panel2);border-radius:8px}
.alts{display:flex;gap:3px;justify-content:center;margin-top:3px}
.alts img{width:22px;height:22px;opacity:.75;border-radius:4px;background:var(--panel2)}
.notes{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:13px}
.tier{margin-bottom:14px}
.tier>div:first-child{font-weight:700;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.tier .dot{width:12px;height:12px;border-radius:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.addon{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--c);border-radius:10px;padding:8px;cursor:pointer}
.addon.open{grid-column:1/-1;display:flex;gap:12px}
.addon img{width:64px;height:64px;object-fit:contain;display:block;margin:0 auto 4px;background:var(--panel2);border-radius:8px}
.addon.open img{margin:0;flex:none}
.addon .n{font-size:12px;text-align:center}
.addon.open .n{text-align:left;font-size:14px;font-weight:600}
.addon .more{display:none;font-size:13px;color:#cfcbc6}
.addon.open .more{display:block}
.addon .more em{color:var(--muted);display:block;margin-top:6px;font-style:normal}
.combos{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.combo{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px}
.combo b{display:block;margin-bottom:6px}
.combo .imgs{display:flex;gap:6px;align-items:center}
.combo img{width:48px;height:48px;object-fit:contain;background:var(--panel2);border-radius:6px}
.tip{position:fixed;z-index:20;max-width:340px;background:#000d;border:1px solid var(--border);padding:8px 10px;border-radius:8px;font-size:12.5px;pointer-events:none;display:none;white-space:pre-line}
.src{color:var(--muted);font-size:12px;margin-top:30px;text-align:center}
.src a{color:var(--muted)}
.nav{display:flex;gap:6px;margin-left:auto}.nav a{color:var(--text);text-decoration:none;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px}.nav a:hover{border-color:var(--accent)}
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<script src="nav.js"></script>
<header>
  <h1>Killer sheet</h1>
  <input id="q" placeholder="Search a killer (e.g. nurse, spirit, wesker…)" autocomplete="off">
  <select id="sel"></select>
  <span class="patch" style="margin-left:0" id="patch"></span>
</header>
<main id="app"></main>
<div class="tip" id="tip"></div>
<script>
window.addEventListener("error",e=>{document.getElementById("app").innerHTML="<p class=\"empty\">Error: "+e.message+"</p>"});
const DATA = /*__DATA__*/null;
const K = DATA.killers;
const TIERS = [
  ["strongest","Strongest","var(--t-strongest)"],
  ["good","Good","var(--t-good)"],
  ["decent","Decent","var(--t-decent)"],
  ["almost-no-effect","Almost no effect","var(--t-almost-no-effect)"],
  ["detrimental","Detrimental","var(--t-detrimental)"]];
const COMBOS = [["best","Best combo"],["solid","Solid combo"],["good","Good value"],["fun","Fun combo"]];
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");

function diffInfo(d){
  const l = (d||"").toLowerCase();
  if(l.startsWith("low")||l.startsWith("easy")||l.startsWith("begin")) return ["Easy","d-easy"];
  if(l.startsWith("inter")||l.startsWith("med")||l.startsWith("mod")) return ["Intermediate","d-mid"];
  if(l.startsWith("high")||l.startsWith("hard")) return ["Hard","d-hard"];
  return [d||"Unknown","d-unk"];
}
// score: substring > word start > subsequence; higher is better
function score(q, k){
  q = norm(q); if(!q) return 0;
  let best = 0;
  for(const name of [k.short, ...k.aliases, k.name]){
    const n = norm(name);
    if(n===q) best = Math.max(best,100);
    else if(n.startsWith(q)) best = Math.max(best,90);
    else if(n.includes(q)) best = Math.max(best,70);
    else { let i=0; for(const c of n){ if(c===q[i]) i++; } if(i===q.length) best = Math.max(best,40); }
  }
  return best;
}
function perkHTML(p){
  const alts = p.alts.length ? `<div class="alts">${p.alts.map(a=>`<img referrerpolicy="no-referrer" src="${esc(a.icon)}" data-f="${esc(a.icon2)}" alt="" data-tip="Alternative: ${esc(a.name)}\n${esc(a.desc)}">`).join("")}</div>` : "";
  return `<div class="perk" data-tip="${esc(p.name)}\n${esc(p.desc)}"><img referrerpolicy="no-referrer" src="${esc(p.icon)}" data-f="${esc(p.icon2)}" alt="">${esc(p.name)}${alts}</div>`;
}
function buildHTML(b,i){
  return `<div class="build ${i===0?"best":""}"><h4>${esc(b.name)}${i===0?'<span class="star">★ Recommended by Otzdarva</span>':""}</h4>
  <div class="perks">${b.perks.map(perkHTML).join("")}</div>
  ${b.notes.length?`<ul class="notes">${b.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`:""}</div>`;
}
let CUR = null, buildTab = "otz";
try { buildTab = localStorage.getItem("et-build-tab") || "otz"; } catch(e){}
function nlBuildHTML(b,i){
  return `<div class="build"><h4><span class="rk">#${i+1}</span>${b.usage}% of games</h4>
  <div class="perks">${b.perks.map(p=>perkHTML({...p,alts:[]})).join("")}</div>
  <div class="bstats"><span>Kill rate <b>${b.rate}%</b></span><span><b>${b.wins}</b>/${b.games} survivors</span></div></div>`;
}
function buildsBox(k){
  if(buildTab==="nl"){
    const l = k.nlBuilds||[];
    return l.length ? `<p class="subline">Most played builds on NightLight (${esc(DATA.nlPeriod)}), without empty slots or the Adept achievement build.</p><div class="builds">${l.map(nlBuildHTML).join("")}</div>`
                    : `<p class="empty">Not enough NightLight data for this killer.</p>`;
  }
  return `<div class="builds">${k.builds.map(buildHTML).join("")}</div>`;
}
function setTab(t){
  buildTab = t; try { localStorage.setItem("et-build-tab", t); } catch(e){}
  $("tabOtz").classList.toggle("on", t==="otz"); $("tabNl").classList.toggle("on", t==="nl");
  $("buildsBox").innerHTML = buildsBox(CUR);
}
function addonCard(a){
  return `<div class="addon" data-tip="${esc(a.name)}
${esc(a.desc)}" style="--c:var(--t-${a.tier})" onclick="this.classList.toggle('open')">
    <img referrerpolicy="no-referrer" loading="lazy" src="${esc(a.img)}" alt=""><div class="n">${esc(a.name)}</div>
    <div class="more">${esc(a.comment)}<em>${esc(a.desc)}</em></div></div>`;
}
function render(k){
  const [dl,dc] = diffInfo(k.difficulty);
  let h = `<section class="hero"><img referrerpolicy="no-referrer" src="${esc(k.portrait)}" data-f="${esc(k.portrait2)}" alt="">
    <div><h2>${esc(k.name)}</h2><span class="badge ${dc}">Difficulty: ${dl}</span>
    <div class="stats">${[k.speed&&"Speed "+esc(k.speed),k.terrorRadius&&"Terror radius "+esc(k.terrorRadius),k.availableIn&&esc(k.availableIn)].filter(Boolean).join(" · ")}</div>
    ${k.otzComment?`<p>${esc(k.otzComment).replace(/\n/g,"</p><p>")}</p>`:""}
    ${k.guide?`<a href="${esc(k.guide)}" target="_blank" style="color:var(--muted)">Latest video guide ↗</a>`:""}</div></section>`;
  CUR = k;
  h += `<h3>Builds</h3><div class="tabs"><button id="tabOtz" class="${buildTab==="otz"?"on":""}" onclick="setTab('otz')">Otz builds (${k.builds.length})</button><button id="tabNl" class="${buildTab==="nl"?"on":""}" onclick="setTab('nl')">NightLight builds (${(k.nlBuilds||[]).length})</button></div><div id="buildsBox">${buildsBox(k)}</div>`;
  if(k.addons.length){
    h += `<h3>Add-ons (${k.addons.length}) — strongest to weakest <small style="color:var(--muted);font-weight:400">· click for details</small></h3>`;
    for(const [key,label,col] of TIERS){
      const list = k.addons.filter(a=>a.tier===key); if(!list.length) continue;
      h += `<div class="tier"><div><span class="dot" style="background:${col}"></span>${label} <span style="color:var(--muted);font-weight:400">(${list.length})</span></div><div class="grid">${list.map(addonCard).join("")}</div></div>`;
    }
    const cs = COMBOS.filter(([c])=>(k.combos[c]||[]).length);
    if(cs.length) h += `<h3>Add-on combos</h3><div class="combos">${cs.map(([c,l])=>`<div class="combo"><b>${l}</b><div class="imgs">${k.combos[c].map(i=>`<img referrerpolicy="no-referrer" src="${esc(k.addons[i].img)}" alt="" data-tip="${esc(k.addons[i].name)}
${esc(k.addons[i].desc)}">`).join("+")}</div></div>`).join("")}</div>`;
  } else h += `<p class="empty">No add-on tier list for this killer.</p>`;
  h += `<p class="src">Sources: <a href="https://otzdarva-builds.com">otzdarva-builds.com</a> · <a href="https://otz-addon-tierlist.pages.dev">otz-addon-tierlist</a> · <a href="https://otzdarva.com/dbd/character-info">otzdarva.com</a></p>`;
  $("app").innerHTML = h;
}
function select(slug){
  const k = K.find(x=>x.slug===slug); if(!k) return;
  $("sel").value = slug; history.replaceState(null,"","#"+slug); render(k); window.scrollTo(0,0);
}
function init(){
  $("patch").textContent = patchLabel(DATA);
  $("sel").innerHTML = '<option value="">— Pick a killer —</option>' + K.map(k=>`<option value="${k.slug}">${esc(k.short)}</option>`).join("");
  $("sel").onchange = e => e.target.value && select(e.target.value);
  $("q").oninput = e => {
    const r = K.map(k=>[score(e.target.value,k),k]).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]);
    if(r.length) select(r[0][1].slug);
  };
  $("q").onkeydown = e => { if(e.key==="Enter") e.target.blur(); };
  fromUrl();
  addEventListener("hashchange", fromUrl);
}
function fromUrl(){
  const p = new URLSearchParams(location.search);
  const want = window.PRESELECT || p.get("k") || decodeURIComponent(location.hash.slice(1));
  const q = p.get("q");
  if(K.some(k=>k.slug===want)) select(want);
  else if(q){ $("q").value=q; $("q").oninput({target:$("q")}); }
  else $("app").innerHTML = K.length ? '<p class="empty">Pick a killer in the list or type their name.</p>' : '<p class="empty">No builds data yet. Open <a href="setup.html">Setup</a> and press “Update database”.</p>';
}
// images: one retry, then fall back to the original URL (wiki.gg)
document.addEventListener("error", e => {
  const i = e.target; if(i.tagName!=="IMG") return;
  const n = +(i.dataset.try||0); i.dataset.try = n+1;
  const base = i.dataset.base || (i.dataset.base = i.src);
  if(n===0) setTimeout(()=>{ i.src = base+(base.includes("?")?"&":"?")+"r=1"; }, 600+Math.random()*800);
  else if(n===1 && i.dataset.f) i.src = i.dataset.f;
}, true);
const tip = $("tip");
document.addEventListener("mousemove", e => {
  const t = e.target.closest("[data-tip]");
  if(!t){ tip.style.display="none"; return; }
  tip.textContent = t.dataset.tip; tip.style.display="block";
  tip.style.left = Math.min(e.clientX+14, innerWidth-360)+"px"; tip.style.top = (e.clientY+14)+"px";
});
init();
</script>
</body>
</html>
