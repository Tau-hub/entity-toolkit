<!doctype html>
<html lang="en" data-shell="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entity Toolkit</title>
<style>
  html, body { height:100%; }
  body { display:flex; flex-direction:column; min-height:0; height:100vh; overflow:hidden; }
  #bar { flex:none; width:100%; padding-bottom:6px; }
  #frames { flex:1; min-height:0; position:relative; }
  #frames iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:transparent; }
  #frames iframe[hidden] { display:none; }
  #closeAsk, #upAsk { position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; background:#000c; }
  #closeAsk.on, #upAsk.on { display:flex; }
  #upAsk .msg { color:var(--gold); font-size:13px; min-height:18px; margin:10px 0 0; } #upAsk .msg.err { color:#ff9aa5; }
  #closeAsk .box, #upAsk .box { background:#14181e; border:1px solid var(--border); border-radius:14px; padding:22px 26px; max-width:460px; box-shadow:0 20px 60px #000c; }
  #closeAsk h2, #upAsk h2 { margin:0 0 8px; font-size:18px; } #closeAsk p, #upAsk p { color:var(--muted); font-size:14px; margin:0 0 14px; }
  #closeAsk .btns, #upAsk .btns { display:flex; gap:10px; flex-wrap:wrap; } #closeAsk label { display:flex; gap:8px; align-items:center; font-size:13px; color:var(--muted); margin:14px 0 0; cursor:pointer; }
  #closeAsk button, #upAsk button { border-radius:999px; padding:9px 18px; font:inherit; font-size:14px; cursor:pointer; border:1px solid var(--border); background:var(--panel2); color:var(--text); }
  #closeAsk button.main, #upAsk button.main { background:linear-gradient(180deg,#d1243a,#7d0f1f); border:0; color:#fff; }
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<script src="nav.js"></script>
<div id="bar" class="topbar"></div>
<div id="frames"></div>
<div id="closeAsk"><div class="box">
  <h2>Close Entity Toolkit?</h2>
  <p>You can keep it running without this window: it stays in the notification area (the red E, bottom right) and keeps reading your matches. Or stop it completely.</p>
  <div class="btns"><button class="main" data-a="tray">Keep it running</button><button data-a="quit">Quit Entity Toolkit</button><button data-a="cancel">Cancel</button></div>
  <label><input type="checkbox" id="closeRemember"> Remember my choice (it can be changed in Settings)</label>
</div></div>
<div id="upAsk"><div class="box">
  <h2 id="upTitle">A new version is available</h2>
  <p id="upText"></p>
  <div class="btns"><button class="main" data-a="now">Update now</button><button data-a="later">Later</button><button data-a="skip">Skip this version</button></div>
  <div class="msg" id="upMsg"></div>
</div></div>
<script>
// The shell keeps the navigation bar and one frame per page. Clicking a button only shows the right frame (created the first time),
// so nothing is reloaded: pages keep their state, and the bar never flickers. Pages open on their own (e.g. /levels.html) come here too.
const PAGES = window.ET_PAGES.concat([[window.ET_SETUP_PAGE, "Setup"]]);  // Setup / Settings is drawn separately, at the far right
let setupDone = true, lastHref = "live.html";
const STATIC = new Set(["killer.html", "survivor_builds.html", "loadout.html"]);  // their data is written into the page: reload after a while hidden
const frames = {};  // file -> { el, search, hiddenAt }
let current = null;

const fileOf = (href) => href.split("?")[0].split("#")[0];
const searchOf = (href) => (href.split("#")[0].split("?")[1] || "");

function drawBar(href) {
  lastHref = href;
  const here = href.split("#")[0];
  const link = ([h, t], cls) => { const on = h.includes("?") ? here === h : fileOf(here) === h; return `<a href="#${h}" data-h="${h}" class="${cls}${on ? " on" : ""}">${t}</a>`; };
  $bar.innerHTML = '<nav class="nav">' + PAGES.slice(0, -1).map((p) => link(p, "")).join("") + link([window.ET_SETUP_PAGE, window.setupLabel(setupDone)], "set") + "</nav>";
  if (fileOf(here) === window.ET_SETUP_PAGE && shell.update && shell.update.finished && !shell.update.running) { try { localStorage.setItem("et-news-seen", shell.update.finished); } catch (e) {} }
  dot();
}
// A dot on the Setup / Settings button: pulsing while the database updates, steady when an update brought something new or a newer toolkit exists.
let shell = {};
const seen = () => { try { return +localStorage.getItem("et-news-seen") || 0; } catch (e) { return 0; } };
function dot() {
  const a = $bar.querySelector("a.set"), u = shell.update || {}, v = shell.version || {};
  if (!a) return;
  const news = u.finished && u.changes > 0 && u.finished > seen();
  const why = u.running ? "The database is updating…" : news ? `The last update brought ${u.changes} change${u.changes > 1 ? "s" : ""}` : v.newer ? `Entity Toolkit ${v.latest} is available` : "";
  a.classList.toggle("dot", !!why); a.classList.toggle("busy", !!u.running); a.title = why;
  const s = shell.shrine;
  for (const [side, kind] of [["K", "killers"], ["S", "survivors"]]) {
    const link = $bar.querySelector(`a[data-h="priorities.html?kind=${kind}"]`), names = (s && s.worth[side]) || [];
    if (!link) continue;
    if (s && link.classList.contains("on")) { try { localStorage.setItem("et-shrine-seen-" + side, s.week); } catch (e) {} }
    let seenWeek = 0; try { seenWeek = +localStorage.getItem("et-shrine-seen-" + side) || 0; } catch (e) {}
    const on = names.length > 0 && seenWeek !== s.week;
    link.classList.toggle("dot", on); link.title = on ? `Shrine of Secrets: ${names.join(", ")} — a perk you do not have` : "";
  }
}
// A newer Entity Toolkit: offered once per start ("ask" mode), installed on a click; "Skip this version" silences that one.
const $up = document.getElementById("upAsk");
let upLater = false, upPoll = 0;
function offerUpdate() {
  const v = shell.version || {};
  if (v.installing) { showUpdate(v); return; }
  let skipped = ""; try { skipped = localStorage.getItem("et-skip-version") || ""; } catch (e) {}
  if (!v.newer || v.mode !== "ask" || upLater || skipped === v.latest) return;
  showUpdate(v);
}
function showUpdate(v) {
  document.getElementById("upTitle").textContent = `Entity Toolkit ${v.latest} is available`;
  document.getElementById("upText").innerHTML = `You have version ${v.current}. ` + (v.can_install
    ? (v.kind === "exe" ? "The new version is downloaded, checked (SHA-256) and installed for you; your data is kept. " : "The code is updated with <code>git pull</code> and the Python packages are refreshed. ") + "The toolkit restarts by itself: do it between two matches."
    : "This copy cannot update itself: get the new version from the release page.") + ` <a href="${v.page}" target="_blank" rel="noopener">What is new</a>`;
  $up.querySelector('[data-a="now"]').textContent = v.can_install ? "Update now" : "Open the release page";
  const m = document.getElementById("upMsg");
  m.className = "msg" + (v.error ? " err" : ""); m.textContent = v.error ? "Update failed: " + v.error : v.installing ? "Updating: " + v.step + "…" : "";
  $up.querySelectorAll("button").forEach((b) => { b.disabled = !!v.installing; });
  $up.classList.add("on");
}
$up.addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-a]");
  if (!b) return;
  const v = shell.version || {};
  if (b.dataset.a === "later") { upLater = true; $up.classList.remove("on"); return; }
  if (b.dataset.a === "skip") { try { localStorage.setItem("et-skip-version", v.latest); } catch (e2) {} $up.classList.remove("on"); return; }
  if (!v.can_install) { window.open(v.page, "_blank"); upLater = true; $up.classList.remove("on"); return; }
  const r = await fetch("/api/update/install", { method: "POST", headers: { "Content-Type": "application/json", "X-Requested-With": "EntityToolkit" }, body: "{}" }).then((x) => x.json());
  shell.version = r.version; showUpdate(shell.version);
  clearInterval(upPoll);
  upPoll = setInterval(async () => {
    try { shell.version = (await fetch("/api/shell", { cache: "no-store" }).then((x) => x.json())).version; showUpdate(shell.version); if (!shell.version.installing) clearInterval(upPoll); }
    catch (e2) { document.getElementById("upMsg").textContent = "Restarting…"; setTimeout(() => location.reload(), 9000); clearInterval(upPoll); }
  }, 1000);
});
async function loadState() { try { shell = await window.ET_STATE; setupDone = shell.setup_done; } catch (e) {} drawBar(lastHref); offerUpdate(); }
setInterval(() => window.etShell && window.etShell.refreshState(), 20000);
const $bar = document.getElementById("bar"), $frames = document.getElementById("frames");

function show(href) {
  const file = fileOf(href), search = searchOf(href);
  if (!PAGES.some(([h]) => fileOf(h) === file)) { href = "live.html"; return go(href); }
  if (current && frames[current]) { frames[current].hiddenAt = Date.now(); }
  let f = frames[file];
  if (!f) {
    const el = document.createElement("iframe");
    el.addEventListener("load", () => { if (current === file) document.title = el.contentDocument.title || "Entity Toolkit"; });
    el.src = href;
    $frames.appendChild(el);
    f = frames[file] = { el, search, hiddenAt: 0, fresh: true };
  } else if (f.search !== search) {  // same page, other query (e.g. killer or survivor priorities): that frame only is reloaded
    f.search = search; f.fresh = true;
    f.el.src = href;
  }
  current = file;
  Object.values(frames).forEach((x) => { x.el.hidden = x !== f; });
  drawBar(href);
  if (f.fresh) f.fresh = false;
  else if (STATIC.has(file) && Date.now() - f.hiddenAt > 60000) f.el.contentWindow.location.reload();
  else f.el.contentWindow.dispatchEvent(new Event("et-show"));  // pages that show live data refresh themselves
  if (f.el.contentDocument && f.el.contentDocument.title) document.title = f.el.contentDocument.title;
}

function go(href) {
  if (location.hash.slice(1) === href) show(href);
  else location.hash = href;  // the hashchange handler shows it (and the back button works)
}

// Inside the Entity Toolkit window: closing it asks what to do (the window program calls askClose, and gets the answer back).
const $ask = document.getElementById("closeAsk");
function askClose() { $ask.classList.add("on"); }
$ask.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-a]");
  if (!b && e.target !== $ask) return;
  $ask.classList.remove("on");
  if (b && b.dataset.a !== "cancel" && window.pywebview) window.pywebview.api.close(b.dataset.a, document.getElementById("closeRemember").checked);
});
window.etShell = { go, askClose, refreshState: async () => { window.ET_STATE = fetch("/api/shell", { cache: "no-store" }).then((r) => r.json()); await loadState(); } };
window.addEventListener("hashchange", () => show(decodeURIComponent(location.hash.slice(1)) || "live.html"));
$bar.addEventListener("click", (e) => {
  const a = e.target.closest("a[data-h]");
  if (!a) return;
  e.preventDefault();
  go(a.dataset.h);
});

(async function start() {
  await loadState();
  let first = decodeURIComponent(location.hash.slice(1));
  if (!first) {
    try { first = (await (await fetch("/api/live", { cache: "no-store" })).json()).ready && setupDone ? "live.html" : "setup.html"; } catch (e) { first = "live.html"; }
    history.replaceState(null, "", "#" + first);
  }
  show(first);
})();
</script>
</body>
</html>
