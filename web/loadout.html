<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random loadout · Entity Toolkit</title>
<style>
  .search { position:relative; }
  #qK { min-width:min(440px,86vw); padding-left:44px; padding-right:46px; width:100%; }
  #arrow { position:absolute; right:6px; top:50%; transform:translateY(-50%); width:34px; height:34px; border:0; border-radius:50%; background:none; color:var(--muted); font-size:14px; transition:.15s; }
  #arrow:hover { color:#fff; background:#ffffff14; }
  .search.open #arrow { transform:translateY(-50%) rotate(180deg); color:var(--gold); }
  #dd { position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:25; max-height:340px; overflow:auto; display:none; background:#130f11; border:1px solid var(--red2); border-radius:16px; padding:6px; box-shadow:0 14px 40px #000d; }
  .search.open #dd { display:block; }
  .opt { display:flex; align-items:center; gap:10px; padding:6px 10px; border-radius:10px; cursor:pointer; }
  .opt:hover, .opt.hl { background:#ffffff14; }
  .opt img { width:30px; height:30px; border-radius:50%; object-fit:cover; background:#000; border:1px solid var(--border); flex:none; }
  .opt .ph { width:30px; height:30px; flex:none; display:grid; place-items:center; font-size:17px; }
  .opt small { color:var(--muted); margin-left:auto; font-size:12px; }
  .opt.none { color:var(--muted); cursor:default; }
  .search::before { content:"⌕"; position:absolute; left:16px; top:50%; transform:translateY(-54%); font-size:20px; color:var(--muted); pointer-events:none; }
  #hint { flex-basis:100%; text-align:center; font-size:13px; letter-spacing:.06em; color:var(--muted); min-height:20px; }
  #hint b { color:var(--gold); } #hint.err { color:#ff6b78; }

  .stage { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:22px; align-items:start; }
  @media (max-width:900px) { .stage { grid-template-columns:1fr; } }
  .poster { padding:12px; box-shadow:0 20px 60px #000a, 0 0 0 1px #d1243a22; }
  .poster canvas { width:100%; display:block; border-radius:10px; animation:fade .5s both; }
  .tools { display:flex; gap:8px; margin-top:12px; align-items:center; flex-wrap:wrap; }
  #msg { color:var(--gold); font-size:13px; }

  .detail { display:flex; flex-direction:column; gap:6px; }
  .sec h3 { display:flex; align-items:center; justify-content:space-between; margin:14px 0 8px; }
  .sec:first-child h3 { margin-top:0; }
  .sec h3 button { border:1px solid var(--border); background:#0006; color:var(--muted); width:30px; height:30px; border-radius:50%; font-size:15px; transition:.2s; }
  .sec h3 button:hover { color:#fff; border-color:var(--accent); transform:rotate(180deg); }
  .row { display:flex; gap:12px; align-items:flex-start; padding:9px 12px 9px 9px; margin-bottom:7px; border-left:3px solid var(--rc);
         animation:rise .45s both; animation-delay:calc(var(--i) * 55ms); cursor:help; }
  .row:hover { transform:translateX(3px); }
  .row .ic { flex:none; width:56px; height:56px; display:grid; place-items:center; border-radius:10px; background:radial-gradient(circle at 50% 35%, color-mix(in srgb,var(--rc) 55%,#000), #000a); box-shadow:inset 0 0 0 1px #fff1; }
  .row .ic.dia { clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%); background:radial-gradient(circle,#5a2b78,#220f30); box-shadow:none; }
  .row .ic img { width:44px; height:44px; object-fit:contain; filter:drop-shadow(0 2px 3px #000a); }
  .row .ic.dia img { width:34px; height:34px; }
  .row .tx { min-width:0; flex:1; }
  .row .top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .row b { font-size:15px; font-weight:600; }
  .row .chip { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--rc); }
  .row .d { font-size:13px; color:#cfc8bd; white-space:pre-line; margin-top:3px; }
  .chk { display:flex; gap:7px; align-items:center; color:var(--muted); font-size:14px; cursor:pointer; user-select:none; }
  @keyframes rise { from { opacity:0; transform:translateY(10px); } }
  @keyframes fade { from { opacity:0; } }
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<script src="nav.js"></script>
<header>
  <h1>Random loadout</h1>
  <div class="sub" id="sub"></div>
</header>

<div class="controls">
  <div class="search"><input id="qK" placeholder="Killer (empty = random) — e.g. nemesis, spirit… or surv" autocomplete="off"><button id="arrow" type="button" title="List of killers">▼</button><div id="dd"></div></div>
  <button class="go" id="bAll">🎲 Reroll</button>
  <label class="chk"><input type="checkbox" id="cOff"> Offering</label>
  <div id="hint"></div>
</div>

<main>
  <section class="stage">
    <div class="poster">
      <canvas id="cv" width="1000" height="610"></canvas>
      <div class="tools">
        <button class="ghost" id="bCopy">Copy image</button>
        <button class="ghost" id="bSave">Download PNG</button>
        <span id="msg"></span>
      </div>
    </div>
    <aside class="detail">
      <div class="sec"><h3><span id="hItem">Add-ons</span><button id="bItem" title="Reroll">↻</button></h3><div id="lItem"></div></div>
      <div class="sec" id="offSec" style="display:none"><h3><span>Offering</span><button id="bOff" title="Reroll">↻</button></h3><div id="lOff"></div></div>
      <div class="sec"><h3><span>Perks</span><button id="bPerks" title="Reroll">↻</button></h3><div id="lPerks"></div></div>
    </aside>
  </section>
</main>
<div id="tip"></div>
<script>
const DATA = /*DATA*/null;
const RARITY = {0:"#5a5a5a",1:"#8a6a38",2:"#d1a82c",3:"#46a850",4:"#8a46c8",5:"#e03a78",8:"#3a8fd8",11:"#c8c8c8"};
const RNAME = {1:"Common",2:"Uncommon",3:"Rare",4:"Very rare",5:"Ultra rare",8:"Event",11:"Limited"};
const TIER_FR = {strongest:"Strongest", good:"Good", decent:"Decent", "almost-no-effect":"Almost no effect", detrimental:"Detrimental"};
const TIER_COL = {strongest:"#e0457b", good:"#e8a33d", decent:"#4aa3df", "almost-no-effect":"#7c8594", detrimental:"#9d58bd"};
const SURV = ["survivor","survivors","survivant","survivants"];
if (!DATA.powers.length) { document.querySelector("main").innerHTML = '<div class="empty">No random-loadout data yet. Open <a href="setup.html">Setup</a> and press “Update database”.</div>'; throw new Error("no data"); }
let mode = "K";
let L = {perks:[], item:null, addons:[], off:null};
let regions = [], entries = [];

const pick = a => a[Math.floor(Math.random()*a.length)];
function sample(a, n){ const c=a.slice(), o=[]; while(o.length<n && c.length) o.push(c.splice(Math.floor(Math.random()*c.length),1)[0]); return o; }
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");
const poolOf = it => mode === "K" ? it.addons : DATA.itemPools[it.pool];
const noteClass = n => n >= 60 ? "n-hi" : n >= 35 ? "n-md" : "n-lo";

// killer search: exact > prefix > contains; the shortest name wins a tie
const killers = [...new Map(DATA.powers.map(p=>[p.kid,p])).values()].sort((a,b)=>a.killer.localeCompare(b.killer));
function findKiller(query){
  const q = norm(query); let best = null;
  for (const p of killers) {
    const ns = (p.names || [p.killer]).map(norm).filter(Boolean);
    const rank = ns.includes(q) ? 0 : ns.some(n=>n.startsWith(q)) ? 1 : ns.some(n=>n.includes(q)) ? 2 : -1;
    if (rank < 0) continue;
    const key = [rank, Math.min(...ns.filter(n=>n.includes(q)).map(n=>n.length)), p.kid];
    if (!best || key[0]<best.key[0] || (key[0]===best.key[0] && (key[1]<best.key[1] || (key[1]===best.key[1] && key[2]<best.key[2])))) best = {key, p};
  }
  return best && best.p;
}
// empty = random killer; else the matching killer; "surv..." = survivor (only if no killer matches)
function resolve(){
  const text = qK.value.trim();
  if (!text) return {mode:"K", power:pick(DATA.powers)};
  const p = findKiller(text);
  if (p) return {mode:"K", power:p};
  const q = norm(text);
  if (q && SURV.some(w=>w.startsWith(q))) return {mode:"S"};
  return {error:`No killer matches "${text}"`};
}
function updateHint(){
  const text = qK.value.trim(), r = !text ? null : resolve();
  hint.className = r && r.error ? "err" : "";
  hint.innerHTML = !text ? "No search: random killer" : r.error ? esc(r.error) : r.mode === "S" ? "→ <b>Survivor</b>" : `→ <b>${esc(r.power.killer)}</b>`;
}
// custom dropdown: arrow / click = ALL killers; typing = filtered list; picking a killer rolls the loadout
const searchBox = document.querySelector(".search");
let hl = -1, shown = [];
const shortName = p => p.killer.replace(/^The /, "");
function openList(filterText){
  const q = norm(filterText || "");
  shown = [{random:true}, {surv:true}, ...killers.filter(p => !q || (p.names||[p.killer]).some(n => norm(n).includes(q)))];
  if (q) shown = shown.filter(o => o.random ? false : o.surv ? SURV.some(w=>w.startsWith(q)) : true);
  hl = -1;
  dd.innerHTML = shown.length ? shown.map((o,i)=> o.random ? `<div class="opt" data-i="${i}"><span class="ph">🎲</span>Random killer</div>`
      : o.surv ? `<div class="opt" data-i="${i}"><span class="ph">🧍</span>Survivor</div>`
      : `<div class="opt" data-i="${i}">${o.portraitUri ? `<img src="${o.portraitUri}" alt="">` : '<span class="ph"></span>'}${esc(shortName(o))}<small>${esc(o.name)}</small></div>`).join("")
      : '<div class="opt none">No killer</div>';
  searchBox.classList.add("open");
}
function closeList(){ searchBox.classList.remove("open"); hl = -1; }
function choose(o){
  qK.value = o.random ? "" : o.surv ? "survivant" : shortName(o);
  closeList(); reroll("all");
}
dd.onmousedown = e => { e.preventDefault(); const el = e.target.closest(".opt[data-i]"); if (el) choose(shown[+el.dataset.i]); };
arrow.onmousedown = e => { e.preventDefault(); if (searchBox.classList.contains("open")) closeList(); else { qK.focus(); openList(""); } };
qK.onfocus = () => openList("");
qK.onclick = () => { if (!searchBox.classList.contains("open")) openList(""); };
qK.oninput = () => { updateHint(); openList(qK.value); };
qK.onblur = closeList;
qK.onkeydown = e => {
  const open = searchBox.classList.contains("open");
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); if (!open) openList("");
    hl = (hl + (e.key === "ArrowDown" ? 1 : -1) + shown.length) % shown.length;
    dd.querySelectorAll(".opt").forEach((el,i)=>el.classList.toggle("hl", i === hl));
    dd.querySelector(".opt.hl")?.scrollIntoView({block:"nearest"});
  } else if (e.key === "Enter") {
    if (open && hl >= 0) choose(shown[hl]); else { closeList(); reroll("all"); }
  } else if (e.key === "Escape") closeList();
};

function rollPerks(){ L.perks = sample(DATA.perks[mode], 4); }
function rollItem(){
  if (!L.item) return;
  L.addons = sample(poolOf(L.item), 2);
}
function rollOff(){ L.off = pick(DATA.offerings[mode].concat(DATA.offerings.B)); }

function ratingText(d){
  if (d.note != null) return `Rating ${d.note}/100` + (d.stars ? ` · Otz ${"★".repeat(d.stars)}${"☆".repeat(3-d.stars)}` : "") + (d.pick != null ? ` · NightLight ${d.pick}% pick, ${d.nlRate}%` : "");
  if (d.tier) return `Otzdarva tier: ${TIER_FR[d.tier]}`;
  return "";
}
function tipHtml(d, kind){
  const meta = [kind, d.rarity ? RNAME[d.rarity] : ""].filter(Boolean).join(" · ");
  const rt = ratingText(d);
  return `<b>${esc(d.name)}</b><i>${esc(meta)}</i>${rt ? `<span style="color:var(--gold)">${esc(rt)}</span>\n` : ""}${esc(d.desc || "No description.")}${d.comment ? `\n\n<span style="color:var(--muted)">Otzdarva's opinion: ${esc(d.comment)}</span>` : ""}`;
}
function showTip(html, e){ tip.innerHTML = html; tip.style.display = "block"; moveTip(e); }
function moveTip(e){ const w=tip.offsetWidth, h=tip.offsetHeight; tip.style.left = Math.min(e.clientX+16, innerWidth-w-8)+"px"; tip.style.top = Math.min(e.clientY+16, innerHeight-h-8)+"px"; }
function hideTip(){ tip.style.display = "none"; }

function noteChip(d){
  if (d.note != null) return `<span class="note ${noteClass(d.note)}">Rating ${d.note}/100</span>`;
  if (d.tier) return `<span class="note t-${d.tier}">${TIER_FR[d.tier]}</span>`;
  return "";
}
function rowHtml(d, kind, i, dia){
  const rc = dia ? "#8a46c8" : (RARITY[d.rarity] || "#8a46c8");
  const idx = entries.push({d, kind}) - 1;
  return `<div class="row" data-e="${idx}" style="--rc:${rc};--i:${i}"><div class="ic${dia?" dia":""}"><img src="${d.icon}" alt=""></div>` +
         `<div class="tx"><div class="top"><b>${esc(d.name)}</b>${noteChip(d)}</div><span class="chip">${esc([kind, d.rarity?RNAME[d.rarity]:""].filter(Boolean).join(" · "))}</span><div class="d">${esc(d.desc||"")}</div></div></div>`;
}
function lists(){
  entries = [];
  const k = mode === "K";
  hItem.textContent = k ? "Add-ons" : "Item & add-ons";
  lItem.innerHTML = (k ? "" : rowHtml(L.item, "Item", 0)) + L.addons.map((a,i)=>rowHtml(a,"Add-on",i+1)).join("");
  offSec.style.display = cOff.checked ? "" : "none";
  lOff.innerHTML = cOff.checked ? rowHtml(L.off, "Offering", 3) : "";
  lPerks.innerHTML = L.perks.map((p,i)=>rowHtml(p, k?"Killer perk":"Survivor perk", i+4, true)).join("");
  document.querySelectorAll(".row").forEach(el=>{
    const get = () => entries[el.dataset.e];
    el.onmouseenter = e => showTip(tipHtml(get().d, get().kind), e);
    el.onmousemove = moveTip; el.onmouseleave = hideTip;
  });
  sub.innerHTML = k ? `${L.item.portraitUri ? `<img src="${L.item.portraitUri}" alt="">` : ""}<span>Killer&nbsp;·&nbsp;<b>${esc(L.item.killer)}</b></span>` : "<span>Survivor</span>";
}

const imgCache = {};
function load(src){ return imgCache[src] || (imgCache[src] = new Promise(r=>{ const i=new Image(); i.onload=()=>r(i); i.src=src; })); }
function path(c, pts){ c.beginPath(); pts.forEach(([x,y],i)=> i?c.lineTo(x,y):c.moveTo(x,y)); c.closePath(); }
function shape(c, kind, cx, cy, r, fill, stroke){
  if (kind === "square") path(c, [[cx-r,cy-r],[cx+r,cy-r],[cx+r,cy+r],[cx-r,cy+r]]);
  if (kind === "diamond") path(c, [[cx,cy-r],[cx+r,cy],[cx,cy+r],[cx-r,cy]]);
  if (kind === "hex") path(c, [0,1,2,3,4,5].map(i=>[cx+r*Math.cos(Math.PI/3*i - Math.PI/2), cy+r*Math.sin(Math.PI/3*i - Math.PI/2)]));
  c.fillStyle = fill; c.fill(); c.lineWidth = 3; c.strokeStyle = stroke; c.stroke();
}
function pill(c, text, cx, cy, color){
  c.font = "700 15px Segoe UI, sans-serif"; c.textAlign = "center"; c.textBaseline = "middle";
  const w = c.measureText(text).width + 22;
  c.fillStyle = color; c.beginPath(); c.roundRect(cx-w/2, cy-12, w, 24, 12); c.fill();
  c.fillStyle = "#fff"; c.fillText(text, cx, cy+1); c.textBaseline = "alphabetic";
}
async function slot(c, kind, cx, cy, r, d, label, fill, stroke, scale){
  shape(c, kind, cx, cy, r, fill, stroke);
  const im = await load(d.icon), k = (r*scale)/Math.max(im.width, im.height)*2;
  c.drawImage(im, cx-im.width*k/2, cy-im.height*k/2, im.width*k, im.height*k);
  regions.push({cx, cy, r:r*0.9, d, label});
}
function heading(c, t, x, y){ c.fillStyle="#c9a46a"; c.font="600 22px Segoe UI, sans-serif"; c.textAlign="left"; c.fillText(t, x, y); }

async function draw(){
  const c = cv.getContext("2d"), W = cv.width, H = cv.height;
  regions = [];
  const g = c.createLinearGradient(0,0,W,H); g.addColorStop(0,"#1f1216"); g.addColorStop(1,"#0c0a0c");
  c.fillStyle = g; c.fillRect(0,0,W,H);
  c.fillStyle="#f3e9d6"; c.font="700 44px Segoe UI, sans-serif"; c.textAlign="left"; c.fillText("LOADOUT", 40, 74);
  if (mode === "K") { c.fillStyle="#c9a46a"; c.font="600 24px Segoe UI, sans-serif"; c.textAlign="right"; c.fillText(L.item.killer, W-40, 70); }
  c.strokeStyle="#4a3236"; c.lineWidth=2;
  c.beginPath(); if (cOff.checked) { c.moveTo(640,100); c.lineTo(640,300); } c.moveTo(40,320); c.lineTo(W-40,320); c.stroke();
  const off = cOff.checked;
  heading(c, mode==="K"?"POWER":"ITEM", 40, 120); heading(c, "ADD-ONS", 270, 120); if (off) heading(c, "OFFERING", 690, 120); heading(c, "PERKS", 40, 362);
  const kindItem = mode==="K" ? "Power" : "Item";
  await slot(c,"square", 120,215, 70, L.item, kindItem, mode==="K"?"#2a1a1e":(RARITY[L.item.rarity]||"#444"), "#e6d6b8", mode==="K"?0.95:0.85);
  for (const [i, cx] of [[0,330],[1,480]]) {
    const a = L.addons[i];
    await slot(c,"square", cx,205, 62, a, "Add-on", RARITY[a.rarity]||"#444", "#e6d6b8", 0.85);
    if (a.tier) pill(c, TIER_FR[a.tier], cx, 298, TIER_COL[a.tier]);
  }
  if (off) await slot(c,"hex", 830,205, 85, L.off, "Offering", RARITY[L.off.rarity]||"#444", "#d9b26f", 0.7);
  for (let i=0;i<4;i++) {
    const p = L.perks[i], cx = 150+i*233;
    await slot(c,"diamond", cx, 480, 105, p, "Perk", "#2a1530", "#9a5bc4", 0.62);
    if (p.note != null) pill(c, `Rating ${p.note}/100`, cx, 580, p.note>=60?"#1e7a45":p.note>=35?"#9a7b12":"#7a3a3a");
  }
}
cv.onmousemove = e => {
  const b = cv.getBoundingClientRect(), x=(e.clientX-b.left)*cv.width/b.width, y=(e.clientY-b.top)*cv.height/b.height;
  const r = regions.find(r=>Math.abs(x-r.cx)<r.r && Math.abs(y-r.cy)<r.r);
  if (r) showTip(tipHtml(r.d, r.label), e); else hideTip();
};
cv.onmouseleave = hideTip;

async function render(){ lists(); await draw(); }
function reroll(which){
  if (which === "all") {
    const r = resolve();
    updateHint();
    if (r.error) return;
    mode = r.mode;
    L.item = mode === "K" ? r.power : pick(DATA.items);
    rollItem(); rollPerks(); rollOff();
    if (!qK.value.trim()) hint.innerHTML = `Random killer: <b>${esc(L.item.killer)}</b>`;
  } else if (which === "item") {
    if (mode === "S") L.item = pick(DATA.items);
    rollItem();
  } else if (which === "perks") rollPerks();
  else rollOff();
  render();
}
cOff.onchange = ()=>{ if (cOff.checked && !L.off) rollOff(); render(); };
bAll.onclick = ()=>reroll("all"); bPerks.onclick = ()=>reroll("perks");
bItem.onclick = ()=>reroll("item"); bOff.onclick = ()=>reroll("off");

const say = t => { msg.textContent = t; setTimeout(()=>msg.textContent="", 2500); };
bSave.onclick = ()=>{ const a=document.createElement("a"); a.href=cv.toDataURL("image/png"); a.download="loadout.png"; a.click(); };
bCopy.onclick = ()=> cv.toBlob(async b=>{
  try { await navigator.clipboard.write([new ClipboardItem({"image/png":b})]); say("Image copied"); }
  catch(e){ say("Copy refused: use Download"); }
});

reroll("all");
</script>
</body>
</html>
