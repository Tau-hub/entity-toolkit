<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random loadout · Entity Toolkit</title>
<style>
  .search { position:relative; }
  #qK { min-width:min(440px,86vw); padding-left:44px; padding-right:46px; width:100%; }
  #arrow { position:absolute; right:6px; top:50%; transform:translateY(-50%); width:34px; height:34px; border:0; border-radius:50%; background:none; color:var(--muted); font-size:14px; transition:.15s; }
  #arrow:hover { color:#fff; background:#ffffff14; }
  .search.open #arrow { transform:translateY(-50%) rotate(180deg); color:var(--gold); }
  #dd { position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:25; max-height:340px; overflow:auto; display:none; background:#130f11; border:1px solid var(--red2); border-radius:16px; padding:6px; box-shadow:0 14px 40px #000d; }
  .search.open #dd { display:block; }
  .opt { display:flex; align-items:center; gap:10px; padding:6px 10px; border-radius:10px; cursor:pointer; }
  .opt:hover, .opt.hl { background:#ffffff14; }
  .opt img { width:30px; height:30px; border-radius:50%; object-fit:cover; background:#000; border:1px solid var(--border); flex:none; }
  .opt .ph { width:30px; height:30px; flex:none; display:grid; place-items:center; font-size:17px; }
  .opt small { color:var(--muted); margin-left:auto; font-size:12px; }
  .opt.none { color:var(--muted); cursor:default; }
  .search::before { content:"⌕"; position:absolute; left:16px; top:50%; transform:translateY(-54%); font-size:20px; color:var(--muted); pointer-events:none; }
  #hint { flex-basis:100%; text-align:center; font-size:13px; letter-spacing:.06em; color:var(--muted); min-height:20px; }
  #hint b { color:var(--gold); } #hint.err { color:#ff6b78; }
  #cons { flex-basis:100%; text-align:center; font-size:12.5px; color:#e8a33d; min-height:0; }
  .chk select { max-width:210px; }
  .side .rb.day { border-color:#c9a46a55; } .side .rb.day small { color:var(--gold); margin-left:4px; }
  #bDone[hidden] { display:none; } #bDone.ok { color:var(--gold); border-color:var(--gold); cursor:default; }

  .stage { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:22px; align-items:start; }
  @media (max-width:900px) { .stage { grid-template-columns:1fr; } }
  .poster { padding:12px; box-shadow:0 20px 60px #000a, 0 0 0 1px #d1243a22; }
  .poster canvas { width:100%; display:block; border-radius:10px; animation:fade .5s both; }
  .tools { display:flex; gap:8px; margin-top:12px; align-items:center; flex-wrap:wrap; }
  #msg { color:var(--gold); font-size:13px; }

  .detail { display:flex; flex-direction:column; gap:6px; }
  .sec h3 { display:flex; align-items:center; justify-content:space-between; margin:14px 0 8px; }
  .sec:first-child h3 { margin-top:0; }
  .sec h3 button { border:1px solid var(--border); background:#0006; color:var(--muted); width:30px; height:30px; border-radius:50%; font-size:15px; transition:.2s; }
  .sec h3 button:hover { color:#fff; border-color:var(--accent); transform:rotate(180deg); }
  .row { display:flex; gap:12px; align-items:flex-start; padding:9px 12px 9px 9px; margin-bottom:7px; border-left:3px solid var(--rc);
         animation:rise .45s both; animation-delay:calc(var(--i) * 55ms); cursor:help; }
  .row:hover { transform:translateX(3px); }
  .row .ic { flex:none; width:56px; height:56px; display:grid; place-items:center; border-radius:7px; border:3px solid #08060a; background:linear-gradient(180deg,var(--c1,#555),var(--c2,#222)); box-shadow:none; }
  .row .ic.dia { border:0; clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%); background:linear-gradient(135deg,#8e4eaa,#3a1c50); box-shadow:none; }
  .row .ic img { width:46px; height:46px; object-fit:contain; filter:drop-shadow(0 2px 3px #000a); }
  .row .ic.dia img { width:42px; height:42px; }
  .row .tx { min-width:0; flex:1; }
  .row .top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .row b { font-size:15px; font-weight:600; }
  .row .chip { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--rc); }
  .row .d { font-size:13px; color:#cfc8bd; white-space:pre-line; margin-top:3px; }
  .chk { display:flex; gap:7px; align-items:center; color:var(--muted); font-size:14px; cursor:pointer; user-select:none; }
  @keyframes rise { from { opacity:0; transform:translateY(10px); } }
  @keyframes fade { from { opacity:0; } }
.seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:#0006}
.seg button{background:none;border:0;color:var(--muted);padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}
.seg button.on{color:#fff;background:linear-gradient(180deg,#d1243a55,#7d0f1f55)}
.layout{display:grid;grid-template-columns:206px minmax(0,1fr);gap:16px;max-width:1380px;margin:0 auto;padding:0 16px;align-items:start}
.layout main{max-width:none;margin:0;padding:0 0 40px;min-width:0}
.side{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow-y:auto;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px;scrollbar-width:thin}
.side .seg{display:flex;width:100%;margin:6px 0 8px}.side .seg button{flex:1;padding:6px 4px}
.side .rb{display:block;width:100%;margin-bottom:6px;padding:8px 6px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font:inherit;font-size:13px;cursor:pointer}
.side .rb:hover{border-color:var(--accent)} .side .rb.on{border-color:var(--accent);background:linear-gradient(180deg,#d1243a33,#7d0f1f33)}
.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.face{background:none;border:0;padding:2px;cursor:pointer;border-radius:50%;line-height:0}
.face img{width:100%;aspect-ratio:1;border-radius:50%;object-fit:cover;object-position:50% 18%;background:var(--panel2);border:2px solid var(--border);transition:.12s}
.face:hover img{border-color:var(--gold);transform:scale(1.08)}
.face.on img{border-color:var(--accent);box-shadow:0 0 0 2px #d1243a66}
.face span{display:none}
/* first visit, nothing rolled yet: every killer in a big grid; once one is picked the grid becomes the left column */
.layout.landing{grid-template-columns:minmax(0,1fr)}
.layout.landing main{display:none}
.layout.landing .side{position:static;max-height:none;overflow:visible;background:none;border:0;padding:0;text-align:center}
.layout.landing .side .rb{display:inline-block;width:auto;margin:0 4px 12px;padding:9px 20px}
.layout.landing .side .seg{display:inline-flex;width:auto;margin:0 0 14px 10px}
.layout.landing .side .seg button{flex:none;padding:7px 20px;font-size:13px}
.layout.landing .faces{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 10px;max-width:1150px;margin:0 auto}
.layout.landing .face{display:flex;flex-direction:column;align-items:center;gap:4px;width:84px;line-height:1.15;font-size:11px;color:var(--muted);padding:3px 0}
.layout.landing .face:hover{color:var(--text)}
.layout.landing .face img{width:64px;height:64px}
.layout.landing .face span{display:block}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.side{position:static;max-height:none;overflow:visible}.faces{display:flex;overflow-x:auto;gap:6px;padding-bottom:4px}.face{flex:none;width:50px}.layout.landing .faces{flex-wrap:wrap}.layout.landing .face{width:84px}}
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<script src="nav.js"></script>
<header>
  <h1>Random loadout</h1>
  <div class="sub" id="sub"></div>
</header>

<div class="controls">
  <div class="search"><input id="qK" placeholder="Killer (empty = random) — e.g. nemesis, spirit… or surv" autocomplete="off"><button id="arrow" type="button" title="List of killers">▼</button><div id="dd"></div></div>
  <button class="go" id="bAll">🎲 Reroll</button>
  <label class="chk"><input type="checkbox" id="cOff"> Offering</label>
  <label class="chk" title="Perks: only those of the characters you have levelled (plus the general perks). Random killer: only the killers you own. Set both on the Levels page."><input type="checkbox" id="cHave"> Only what I have</label>
  <label class="chk" title="One of the four perks is always of this type">At least one <select id="sType"><option value="">perk of any type</option></select></label>
  <label class="chk" title="Leaves out the perks rated below this (rating out of 100, see the priorities pages)">Perks rated <select id="sMin"><option value="0">any</option><option value="35">35+</option><option value="60">60+</option></select></label>
  <div id="hint"></div>
  <div id="cons"></div>
</div>

<div class="layout landing" id="layout">
<aside class="side">
  <button class="rb" id="bRandom" type="button">🎲 Random killer</button><button class="rb" id="bSurv" type="button">🧍 Survivor</button>
  <button class="rb day" id="bDayK" type="button" title="Today's challenge as killer: the same killer, add-ons and perks for everyone, a new one every day">📅 Daily killer<small></small></button><button class="rb day" id="bDayS" type="button" title="Today's challenge as survivor: the same item, add-ons and perks for everyone, a new one every day">📅 Daily survivor<small></small></button>
  <div class="seg" id="sortSeg"><button data-v="release" title="Release date">Release</button><button data-v="az" title="Alphabetical">A–Z</button></div>
  <div class="faces" id="faces"></div>
</aside>
<main>
  <section class="stage">
    <div class="poster">
      <canvas id="cv" width="1000" height="610"></canvas>
      <div class="tools">
        <button class="ghost" id="bCopy">Copy image</button>
        <button class="ghost" id="bSave">Download PNG</button>
        <button class="ghost" id="bDone" hidden></button>
        <span id="msg"></span>
      </div>
    </div>
    <aside class="detail">
      <div class="sec"><h3><span id="hItem">Add-ons</span><button id="bItem" title="Reroll">↻</button></h3><div id="lItem"></div></div>
      <div class="sec" id="offSec" style="display:none"><h3><span>Offering</span><button id="bOff" title="Reroll">↻</button></h3><div id="lOff"></div></div>
      <div class="sec"><h3><span>Perks</span><button id="bPerks" title="Reroll">↻</button></h3><div id="lPerks"></div></div>
    </aside>
  </section>
</main>
</div>
<div id="tip"></div>
<script>
const DATA = /*DATA*/null;
// Rarity colours as the game paints them: a lit gradient (lighter on top), not a flat fill
const RGRAD = {0:["#6a6a6a","#383838"],1:["#6b4a38","#3a2418"],2:["#f0bd1c","#c98a0c"],3:["#3f9a4c","#1e5a2c"],4:["#8a3fb0","#44205f"],5:["#e0407a","#8a1e48"],8:["#3f82d0","#1d3f78"],11:["#d8d8d8","#8c8c8c"]};
const rgrad = r => RGRAD[r] || RGRAD[0];
const RARITY = {0:"#5a5a5a",1:"#8a6a38",2:"#d1a82c",3:"#46a850",4:"#8a46c8",5:"#e03a78",8:"#3a8fd8",11:"#c8c8c8"};
const RNAME = {1:"Common",2:"Uncommon",3:"Rare",4:"Very rare",5:"Ultra rare",8:"Event",11:"Limited"};
const TIER_FR = {strongest:"Strongest", good:"Good", decent:"Decent", "almost-no-effect":"Almost no effect", detrimental:"Detrimental"};
const TIER_COL = {strongest:"#e0457b", good:"#e8a33d", decent:"#4aa3df", "almost-no-effect":"#7c8594", detrimental:"#9d58bd"};
const SURV = ["survivor","survivors","survivant","survivants"];
if (!DATA.powers.length) { document.querySelector("main").innerHTML = '<div class="empty">No random-loadout data yet. Open <a href="setup.html">Setup</a> and press “Update database”.</div>'; throw new Error("no data"); }
let mode = "K";
let L = {perks:[], item:null, addons:[], off:null};
let regions = [], entries = [];

// every draw goes through rnd: Math.random normally, a generator seeded with the date for the daily challenge
let rnd = Math.random;
const pick = a => a[Math.floor(rnd()*a.length)];
function sample(a, n){ const c=a.slice(), o=[]; while(o.length<n && c.length) o.push(c.splice(Math.floor(rnd()*c.length),1)[0]); return o; }
function seeded(text){  // the same text always gives the same sequence of numbers (xmur3 hash + mulberry32)
  let h = 1779033703 ^ text.length;
  for (let i = 0; i < text.length; i++) { h = Math.imul(h ^ text.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  let a = h >>> 0;
  return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");
const poolOf = it => mode === "K" ? it.addons : DATA.itemPools[it.pool];
const noteClass = n => n >= 60 ? "n-hi" : n >= 35 ? "n-md" : "n-lo";

// killer search: exact > prefix > contains; the shortest name wins a tie
const killers = [...new Map(DATA.powers.map(p=>[p.kid,p])).values()].sort((a,b)=>a.killer.localeCompare(b.killer));
function findKiller(query){
  const q = norm(query); let best = null;
  for (const p of killers) {
    const ns = (p.names || [p.killer]).map(norm).filter(Boolean);
    const rank = ns.includes(q) ? 0 : ns.some(n=>n.startsWith(q)) ? 1 : ns.some(n=>n.includes(q)) ? 2 : -1;
    if (rank < 0) continue;
    const key = [rank, Math.min(...ns.filter(n=>n.includes(q)).map(n=>n.length)), p.kid];
    if (!best || key[0]<best.key[0] || (key[0]===best.key[0] && (key[1]<best.key[1] || (key[1]===best.key[1] && key[2]<best.key[2])))) best = {key, p};
  }
  return best && best.p;
}
// empty = random killer; else the matching killer; "surv..." = survivor (only if no killer matches)
function resolve(){
  const text = qK.value.trim();
  if (!text) return {mode:"K", power:pick(killerPool())};
  const p = findKiller(text);
  if (p) return {mode:"K", power:p};
  const q = norm(text);
  if (q && SURV.some(w=>w.startsWith(q))) return {mode:"S"};
  return {error:`No killer matches "${text}"`};
}
function updateHint(){
  const text = qK.value.trim(), r = !text ? null : resolve();
  hint.className = r && r.error ? "err" : "";
  hint.innerHTML = !text ? "No search: random killer" : r.error ? esc(r.error) : r.mode === "S" ? "→ <b>Survivor</b>" : `→ <b>${esc(r.power.killer)}</b>`;
}
// custom dropdown: arrow / click = ALL killers; typing = filtered list; picking a killer rolls the loadout
const searchBox = document.querySelector(".search");
let hl = -1, shown = [];
const shortName = p => p.killer.replace(/^The /, "");
function openList(filterText){
  const q = norm(filterText || "");
  shown = [{random:true}, {surv:true}, ...killers.filter(p => !q || (p.names||[p.killer]).some(n => norm(n).includes(q)))];
  if (q) shown = shown.filter(o => o.random ? false : o.surv ? SURV.some(w=>w.startsWith(q)) : true);
  hl = -1;
  dd.innerHTML = shown.length ? shown.map((o,i)=> o.random ? `<div class="opt" data-i="${i}"><span class="ph">🎲</span>Random killer</div>`
      : o.surv ? `<div class="opt" data-i="${i}"><span class="ph">🧍</span>Survivor</div>`
      : `<div class="opt" data-i="${i}">${o.portraitUri ? `<img src="${o.portraitUri}" alt="">` : '<span class="ph"></span>'}${esc(shortName(o))}<small>${esc(o.name)}</small></div>`).join("")
      : '<div class="opt none">No killer</div>';
  searchBox.classList.add("open");
}
function closeList(){ searchBox.classList.remove("open"); hl = -1; }
// the killers, as portraits: a big grid first, then a left column (same pattern as the killer sheet)
let sortMode = "release";
try { sortMode = localStorage.getItem("et-killer-sort") || sortMode; } catch(e){}
const sortedKillers = () => sortMode === "az" ? killers.slice().sort((a,b)=>shortName(a).localeCompare(shortName(b))) : killers.slice().sort((a,b)=>a.kid-b.kid);
function renderFaces(){
  const cur = mode === "K" && L.item ? L.item.kid : null;
  faces.innerHTML = sortedKillers().map(p=>`<button class="face${p.kid===cur?" on":""}" data-k="${p.kid}" title="${esc(p.killer)}"><img src="${p.portraitUri || p.icon}" alt=""><span>${esc(shortName(p))}</span></button>`).join("");
  bSurv.classList.toggle("on", mode === "S" && !!L.item && !dailyOn);
  document.querySelectorAll("#sortSeg button").forEach(b=>b.classList.toggle("on", b.dataset.v === sortMode));
}
faces.onclick = e => { const b = e.target.closest(".face"); if (b) choose(killers.find(p=>p.kid === +b.dataset.k)); };
bRandom.onclick = () => choose({random:true});
bSurv.onclick = () => choose({surv:true});
document.querySelectorAll("#sortSeg button").forEach(b => b.addEventListener("click", () => {
  sortMode = b.dataset.v; try { localStorage.setItem("et-killer-sort", sortMode); } catch(e){}
  renderFaces();
}));

function choose(o){
  qK.value = o.random ? "" : o.surv ? "survivant" : shortName(o);
  closeList(); reroll("all");
}
dd.onmousedown = e => { e.preventDefault(); const el = e.target.closest(".opt[data-i]"); if (el) choose(shown[+el.dataset.i]); };
arrow.onmousedown = e => { e.preventDefault(); if (searchBox.classList.contains("open")) closeList(); else { qK.focus(); openList(""); } };
qK.onfocus = () => openList("");
qK.onclick = () => { if (!searchBox.classList.contains("open")) openList(""); };
qK.oninput = () => { updateHint(); openList(qK.value); };
qK.onblur = closeList;
qK.onkeydown = e => {
  const open = searchBox.classList.contains("open");
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); if (!open) openList("");
    hl = (hl + (e.key === "ArrowDown" ? 1 : -1) + shown.length) % shown.length;
    dd.querySelectorAll(".opt").forEach((el,i)=>el.classList.toggle("hl", i === hl));
    dd.querySelector(".opt.hl")?.scrollIntoView({block:"nearest"});
  } else if (e.key === "Enter") {
    if (open && hl >= 0) choose(shown[hl]); else { closeList(); reroll("all"); }
  } else if (e.key === "Escape") closeList();
};

// ---- filters: only what you have, one perk of a given type, a minimum rating (remembered between visits)
const OWNED = new Set(DATA.ownedKillers || []);
const TYPE_LABEL = {};
(function fillTypes(){
  const groups = new Map();
  for (const side of ["K", "S"]) for (const t of (DATA.types || {})[side] || []) {
    TYPE_LABEL[t.id] = t.label;
    if (!groups.has(t.group)) groups.set(t.group, new Map());
    groups.get(t.group).set(t.id, t.label);
  }
  sType.innerHTML += [...groups].map(([g, ts]) => `<optgroup label="${esc(g)}">${[...ts].map(([id, label]) => `<option value="${id}">${esc(label)}</option>`).join("")}</optgroup>`).join("");
  try { const s = JSON.parse(localStorage.getItem("et-loadout-filters") || "{}"); cHave.checked = !!s.have; sType.value = s.type || ""; sMin.value = s.min || "0"; } catch(e){}
  if (sType.selectedIndex < 0) sType.value = "";
})();
const saveFilters = () => { try { localStorage.setItem("et-loadout-filters", JSON.stringify({have:cHave.checked, type:sType.value, min:sMin.value})); } catch(e){} };
let notes = [];
function killerPool(){
  if (!cHave.checked) return DATA.powers;
  const mine = DATA.powers.filter(p => OWNED.has(p.killer));
  return mine.length ? mine : DATA.powers;
}
function perkPool(side, strict){
  let pool = DATA.perks[side];
  if (cHave.checked) {
    const mine = pool.filter(p => p.have);
    if (mine.length >= 4) pool = mine; else notes.push(`You have fewer than 4 ${side === "K" ? "killer" : "survivor"} perks according to the Levels page: every perk is used`);
  }
  if (strict && +sMin.value) {
    const good = pool.filter(p => (p.note ?? 0) >= +sMin.value);
    if (good.length >= 4) pool = good; else notes.push(`Fewer than 4 perks are rated ${sMin.value}+: the rating is ignored`);
  }
  return pool;
}
function rollPerks(){
  notes = [];
  const pool = perkPool(mode, true), type = sType.value;
  let first = [];
  if (type) {
    const fit = pool.filter(p => (p.types || []).includes(type));
    if (fit.length) first = [pick(fit)]; else notes.push(`No ${mode === "K" ? "killer" : "survivor"} perk of the type “${TYPE_LABEL[type] || type}” fits the other filters: the type is ignored`);
  }
  const rest = sample(pool.filter(p => p !== first[0]), 4 - first.length);
  L.perks = first.concat(rest);
  if (first.length) { const at = Math.floor(rnd()*4); L.perks.splice(at, 0, L.perks.shift()); }  // the perk of the asked type is not always the first one
  cons.textContent = notes.join(" · ");
}

// ---- daily challenge: one loadout per day and per side, drawn from the date so everyone gets the same one
let dailyOn = null;
const today = () => new Date().toISOString().slice(0, 10);  // the date in UTC: the challenge changes at the same moment for everyone
const byName = (a, b) => a.name < b.name ? -1 : a.name > b.name ? 1 : 0;
const dayLabel = d => new Date(d + "T00:00:00Z").toLocaleDateString("en-GB", {weekday:"short", day:"numeric", month:"short", year:"numeric", timeZone:"UTC"});
function progress(){ try { return JSON.parse(localStorage.getItem("et-daily") || "{}"); } catch(e){ return {}; } }
function daily(side){
  const day = today();
  notes = [];
  rnd = seeded(`entity-toolkit|${day}|${side}`);
  mode = side;
  if (side === "K") { const ks = killers.filter(p => !cHave.checked || OWNED.has(p.killer)); L.item = pick((ks.length ? ks : killers).slice().sort((a, b) => a.kid - b.kid)); }
  else L.item = pick(DATA.items.slice().sort(byName));
  L.addons = sample(poolOf(L.item).slice().sort(byName), 2);
  L.perks = sample(perkPool(side, false).slice().sort(byName), 4);
  L.off = pick(DATA.offerings[side].concat(DATA.offerings.B).sort(byName));
  rnd = Math.random;
  dailyOn = {side, day};
  qK.value = ""; closeList();
  hint.className = "";
  hint.innerHTML = `Daily ${side === "K" ? "killer" : "survivor"} challenge · <b>${esc(dayLabel(day))}</b> · ` + (cHave.checked ? "your own version (only what you have)" : "the same for everyone today") + " · a new one at midnight UTC";
  cons.textContent = notes.join(" · ");
  render();
}
function drawDaily(){
  const p = progress(), day = today();
  for (const [side, b] of [["K", bDayK], ["S", bDayS]]) {
    const s = p[side] || {}, done = s.last === day;
    b.classList.toggle("on", !!dailyOn && dailyOn.side === side);
    b.querySelector("small").textContent = done ? `✓ ${s.streak} day${s.streak > 1 ? "s" : ""}` : "";
  }
  bDone.hidden = !dailyOn;
  if (dailyOn) {
    const s = p[dailyOn.side] || {}, done = s.last === dailyOn.day;
    bDone.classList.toggle("ok", done);
    bDone.textContent = done ? `✓ Done · ${s.streak} day${s.streak > 1 ? "s" : ""} in a row` : "✓ I played it";
  }
}
bDone.onclick = () => {
  if (!dailyOn) return;
  const p = progress(), s = p[dailyOn.side] || {};
  if (s.last === dailyOn.day) return;
  const before = new Date(new Date(dailyOn.day + "T00:00:00Z") - 86400000).toISOString().slice(0, 10);
  p[dailyOn.side] = {last: dailyOn.day, streak: s.last === before ? (s.streak || 0) + 1 : 1};
  try { localStorage.setItem("et-daily", JSON.stringify(p)); } catch(e){}
  drawDaily();
};
bDayK.onclick = () => daily("K"); bDayS.onclick = () => daily("S");
cHave.onchange = () => { saveFilters(); if (dailyOn) daily(dailyOn.side); else if (L.item) reroll("perks"); };
sType.onchange = sMin.onchange = () => { saveFilters(); if (L.item && !dailyOn) reroll("perks"); };
function rollItem(){
  if (!L.item) return;
  L.addons = sample(poolOf(L.item), 2);
}
function rollOff(){ L.off = pick(DATA.offerings[mode].concat(DATA.offerings.B)); }

function ratingText(d){
  if (d.note != null) return `Rating ${d.note}/100` + (d.stars ? ` · Otz ${"★".repeat(d.stars)}${"☆".repeat(3-d.stars)}` : "") + (d.pick != null ? ` · NightLight ${d.pick}% pick, ${d.nlRate}%` : "");
  if (d.tier) return `Otzdarva tier: ${TIER_FR[d.tier]}`;
  return "";
}
function tipHtml(d, kind){
  const meta = [kind, d.rarity ? RNAME[d.rarity] : ""].filter(Boolean).join(" · ");
  const rt = ratingText(d);
  return `<b>${esc(d.name)}</b><i>${esc(meta)}</i>${rt ? `<span style="color:var(--gold)">${esc(rt)}</span>\n` : ""}${esc(d.desc || "No description.")}${d.comment ? `\n\n<span style="color:var(--muted)">Otzdarva's opinion: ${esc(d.comment)}</span>` : ""}`;
}
function showTip(html, e){ tip.innerHTML = html; tip.style.display = "block"; moveTip(e); }
function moveTip(e){ const w=tip.offsetWidth, h=tip.offsetHeight; tip.style.left = Math.min(e.clientX+16, innerWidth-w-8)+"px"; tip.style.top = Math.min(e.clientY+16, innerHeight-h-8)+"px"; }
function hideTip(){ tip.style.display = "none"; }

function noteChip(d){
  if (d.note != null) return `<span class="note ${noteClass(d.note)}">Rating ${d.note}/100</span>`;
  if (d.tier) return `<span class="note t-${d.tier}">${TIER_FR[d.tier]}</span>`;
  return "";
}
function rowHtml(d, kind, i, dia){
  const rc = dia ? "#8e4eaa" : (RARITY[d.rarity] || "#8a46c8"), [c1, c2] = rgrad(d.rarity);
  const idx = entries.push({d, kind}) - 1;
  return `<div class="row" data-e="${idx}" style="--rc:${rc};--c1:${c1};--c2:${c2};--i:${i}"><div class="ic${dia?" dia":""}"><img src="${d.icon}" alt=""></div>` +
         `<div class="tx"><div class="top"><b>${esc(d.name)}</b>${noteChip(d)}</div><span class="chip">${esc([kind, d.rarity?RNAME[d.rarity]:""].filter(Boolean).join(" · "))}</span><div class="d">${esc(d.desc||"")}</div></div></div>`;
}
function lists(){
  entries = [];
  const k = mode === "K";
  hItem.textContent = k ? "Add-ons" : "Item & add-ons";
  lItem.innerHTML = (k ? "" : rowHtml(L.item, "Item", 0)) + L.addons.map((a,i)=>rowHtml(a,"Add-on",i+1)).join("");
  offSec.style.display = cOff.checked ? "" : "none";
  lOff.innerHTML = cOff.checked ? rowHtml(L.off, "Offering", 3) : "";
  lPerks.innerHTML = L.perks.map((p,i)=>rowHtml(p, k?"Killer perk":"Survivor perk", i+4, true)).join("");
  document.querySelectorAll(".row").forEach(el=>{
    const get = () => entries[el.dataset.e];
    el.onmouseenter = e => showTip(tipHtml(get().d, get().kind), e);
    el.onmousemove = moveTip; el.onmouseleave = hideTip;
  });
  const pre = dailyOn ? `Daily challenge&nbsp;·&nbsp;${esc(dayLabel(dailyOn.day))}&nbsp;·&nbsp;` : "";
  sub.innerHTML = k ? `${L.item.portraitUri ? `<img src="${L.item.portraitUri}" alt="">` : ""}<span>${pre}Killer&nbsp;·&nbsp;<b>${esc(L.item.killer)}</b></span>` : `<span>${pre}Survivor</span>`;
}

const imgCache = {};
function load(src){ return imgCache[src] || (imgCache[src] = new Promise(r=>{ const i=new Image(); i.onload=()=>r(i); i.src=src; })); }
function path(c, pts){ c.beginPath(); pts.forEach(([x,y],i)=> i?c.lineTo(x,y):c.moveTo(x,y)); c.closePath(); }
function shape(c, kind, cx, cy, r, fill, stroke){
  if (kind === "square") path(c, [[cx-r,cy-r],[cx+r,cy-r],[cx+r,cy+r],[cx-r,cy+r]]);
  if (kind === "diamond") path(c, [[cx,cy-r],[cx+r,cy],[cx,cy+r],[cx-r,cy]]);
  if (kind === "hex") path(c, [0,1,2,3,4,5].map(i=>[cx+r*Math.cos(Math.PI/3*i - Math.PI/2), cy+r*Math.sin(Math.PI/3*i - Math.PI/2)]));
  c.fillStyle = fill; c.fill(); c.lineWidth = 3; c.strokeStyle = stroke; c.stroke();
}
function pill(c, text, cx, cy, color){
  c.font = "700 15px Segoe UI, sans-serif"; c.textAlign = "center"; c.textBaseline = "middle";
  const w = c.measureText(text).width + 22;
  c.fillStyle = color; c.beginPath(); c.roundRect(cx-w/2, cy-12, w, 24, 12); c.fill();
  c.fillStyle = "#fff"; c.fillText(text, cx, cy+1); c.textBaseline = "alphabetic";
}
async function slot(c, kind, cx, cy, r, d, label, fill, stroke, scale){
  shape(c, kind, cx, cy, r, fill, stroke);
  const im = await load(d.icon), k = (r*scale)/Math.max(im.width, im.height)*2;
  c.drawImage(im, cx-im.width*k/2, cy-im.height*k/2, im.width*k, im.height*k);
  regions.push({cx, cy, r:r*0.9, d, label});
}
// A perk, drawn like the game's menu: a lit gradient diamond (violet for survivors, crimson for killers) in a thick dark border, big glyph.
const TIER = { S: ["#8e4eaa", "#3a1c50"] };
async function perkSlot(c, cx, cy, r, d, label, side){
  const dia = (k) => path(c, [[cx,cy-k],[cx+k,cy],[cx,cy+k],[cx-k,cy]]);
  dia(r); c.fillStyle = "#08060a"; c.fill();                                   // dark border
  dia(r - 7);
  const g = c.createLinearGradient(cx - r, cy - r, cx + r, cy + r); g.addColorStop(0, TIER[side][0]); g.addColorStop(1, TIER[side][1]);
  c.fillStyle = g; c.fill();
  path(c, [[cx, cy - r*0.86],[cx + r*0.28, cy - r*0.56],[cx, cy - r*0.26],[cx - r*0.28, cy - r*0.56]]); c.fillStyle = "rgba(255,255,255,0.10)"; c.fill();   // light catching the top
  const im = await load(d.icon), k = (r*0.74*2)/Math.max(im.width, im.height);
  c.drawImage(im, cx - im.width*k/2, cy - im.height*k/2, im.width*k, im.height*k);
  regions.push({cx, cy, r:r*0.9, d, label});
}
// speckled grain over the frames, like the game's textured backgrounds
let GRAIN = null;
function grain(){
  if (GRAIN) return GRAIN;
  const g = document.createElement("canvas"); g.width = g.height = 96;
  const x = g.getContext("2d"), id = x.createImageData(96, 96);
  for (let i = 0; i < id.data.length; i += 4) {
    const v = Math.random();
    if (v < 0.10) { id.data[i] = id.data[i+1] = id.data[i+2] = 0; id.data[i+3] = 60 + Math.random()*70; }
    else if (v > 0.965) { id.data[i] = id.data[i+1] = id.data[i+2] = 255; id.data[i+3] = 35 + Math.random()*40; }
  }
  x.putImageData(id, 0, 0);
  return GRAIN = g;
}
const trimCache = {};
function trimmed(im){  // the icon cropped to its visible glyph, so it can fill the frame
  if (trimCache[im.src]) return trimCache[im.src];
  const c = document.createElement("canvas"); c.width = im.width; c.height = im.height;
  const x = c.getContext("2d"); x.drawImage(im, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height).data;
  let x0 = c.width, y0 = c.height, x1 = 0, y1 = 0;
  for (let y = 0; y < c.height; y++) for (let xx = 0; xx < c.width; xx++) if (d[(y*c.width + xx)*4 + 3] > 24) { if (xx < x0) x0 = xx; if (xx > x1) x1 = xx; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 <= x0 || y1 <= y0) return trimCache[im.src] = {src:im, sx:0, sy:0, sw:im.width, sh:im.height};
  return trimCache[im.src] = {src:im, sx:x0, sy:y0, sw:x1-x0+1, sh:y1-y0+1};
}
async function gameSquare(c, cx, cy, r, d, label, grad, fill){
  const bw = Math.max(5, r*0.09), x = cx - r + bw, y = cy - r + bw, w = 2*(r - bw);
  c.fillStyle = "#08060a"; c.beginPath(); c.roundRect(cx - r, cy - r, 2*r, 2*r, 7); c.fill();         // thick dark border
  const g = c.createLinearGradient(0, y, 0, y + w); g.addColorStop(0, grad[0]); g.addColorStop(1, grad[1]);
  c.save(); c.beginPath(); c.rect(x, y, w, w); c.clip();
  c.fillStyle = g; c.fillRect(x, y, w, w);
  c.fillStyle = c.createPattern(grain(), "repeat"); c.fillRect(x, y, w, w);
  c.restore();
  const t = trimmed(await load(d.icon)), k = (w*fill)/Math.max(t.sw, t.sh);
  c.drawImage(t.src, t.sx, t.sy, t.sw, t.sh, cx - t.sw*k/2, cy - t.sh*k/2, t.sw*k, t.sh*k);
  regions.push({cx, cy, r:r*0.9, d, label});
}
function heading(c, t, x, y){ c.fillStyle="#c9a46a"; c.font="600 22px Segoe UI, sans-serif"; c.textAlign="left"; c.fillText(t, x, y); }

async function draw(){
  const c = cv.getContext("2d"), W = cv.width, H = cv.height;
  regions = [];
  const g = c.createLinearGradient(0,0,W,H); g.addColorStop(0,"#1f1216"); g.addColorStop(1,"#0c0a0c");
  c.fillStyle = g; c.fillRect(0,0,W,H);
  c.fillStyle="#f3e9d6"; c.font="700 44px Segoe UI, sans-serif"; c.textAlign="left"; c.fillText(dailyOn ? "DAILY CHALLENGE" : "LOADOUT", 40, 74);
  if (dailyOn) { const w = c.measureText("DAILY CHALLENGE").width; c.fillStyle="#9a8f80"; c.font="500 20px Segoe UI, sans-serif"; c.fillText(dayLabel(dailyOn.day) + (mode === "S" ? " · Survivor" : ""), 56 + w, 72); }
  if (mode === "K") { c.fillStyle="#c9a46a"; c.font="600 24px Segoe UI, sans-serif"; c.textAlign="right"; c.fillText(L.item.killer, W-40, 70); }
  c.strokeStyle="#4a3236"; c.lineWidth=2;
  c.beginPath(); if (cOff.checked) { c.moveTo(640,100); c.lineTo(640,300); } c.moveTo(40,320); c.lineTo(W-40,320); c.stroke();
  const off = cOff.checked;
  heading(c, mode==="K"?"POWER":"ITEM", 40, 120); heading(c, "ADD-ONS", 270, 120); if (off) heading(c, "OFFERING", 690, 120); heading(c, "PERKS", 40, 362);
  const kindItem = mode==="K" ? "Power" : "Item";
  await gameSquare(c, 120, 215, 70, L.item, kindItem, mode==="K" ? ["#4a3038","#1c1216"] : rgrad(L.item.rarity), mode==="K" ? 0.98 : 0.84);
  for (const [i, cx] of [[0,330],[1,480]]) {
    const a = L.addons[i];
    await gameSquare(c, cx, 205, 62, a, "Add-on", rgrad(a.rarity), 0.84);
    if (a.tier) pill(c, TIER_FR[a.tier], cx, 298, TIER_COL[a.tier]);
  }
  if (off) await slot(c,"hex", 830,205, 85, L.off, "Offering", RARITY[L.off.rarity]||"#444", "#d9b26f", 0.7);
  for (let i=0;i<4;i++) {
    const p = L.perks[i], cx = 150+i*233;
    await perkSlot(c, cx, 480, 105, p, "Perk", "S");
    if (p.note != null) pill(c, `Rating ${p.note}/100`, cx, 580, p.note>=60?"#1e7a45":p.note>=35?"#9a7b12":"#7a3a3a");
  }
}
cv.onmousemove = e => {
  const b = cv.getBoundingClientRect(), x=(e.clientX-b.left)*cv.width/b.width, y=(e.clientY-b.top)*cv.height/b.height;
  const r = regions.find(r=>Math.abs(x-r.cx)<r.r && Math.abs(y-r.cy)<r.r);
  if (r) showTip(tipHtml(r.d, r.label), e); else hideTip();
};
cv.onmouseleave = hideTip;

async function render(){ layout.classList.remove("landing"); renderFaces(); drawDaily(); lists(); await draw(); }
function reroll(which){
  dailyOn = null;
  if (which === "all") {
    const r = resolve();
    updateHint();
    if (r.error) return;
    mode = r.mode;
    L.item = mode === "K" ? r.power : pick(DATA.items);
    rollItem(); rollPerks(); rollOff();
    if (!qK.value.trim()) hint.innerHTML = `Random killer: <b>${esc(L.item.killer)}</b>`;
  } else if (which === "item") {
    if (mode === "S") L.item = pick(DATA.items);
    rollItem();
  } else if (which === "perks") rollPerks();
  else rollOff();
  render();
}
cOff.onchange = ()=>{ if (cOff.checked && !L.off) rollOff(); render(); };
bAll.onclick = ()=>reroll("all"); bPerks.onclick = ()=>reroll("perks");
bItem.onclick = ()=>reroll("item"); bOff.onclick = ()=>reroll("off");

const say = t => { msg.textContent = t; setTimeout(()=>msg.textContent="", 2500); };
bSave.onclick = ()=>{ const a=document.createElement("a"); a.href=cv.toDataURL("image/png"); a.download = dailyOn ? `daily-${dailyOn.side === "K" ? "killer" : "survivor"}-${dailyOn.day}.png` : "loadout.png"; a.click(); };
bCopy.onclick = ()=> cv.toBlob(async b=>{
  try { await navigator.clipboard.write([new ClipboardItem({"image/png":b})]); say("Image copied"); }
  catch(e){ say("Copy refused: use Download"); }
});

renderFaces(); drawDaily();
hint.textContent = "Pick a killer below, roll a random one, search for one, or play today's challenge.";
const asked = new URLSearchParams(location.search).get("daily");  // loadout.html?daily=K / ?daily=S (the notification-area icon opens these)
if (asked) daily(asked.toUpperCase() === "S" ? "S" : "K");
</script>
