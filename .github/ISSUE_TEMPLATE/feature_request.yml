name: Feature request
description: An idea to improve Entity Toolkit
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like the toolkit to do?
  - type: textarea
    id: alt
    attributes:
      label: Alternatives you thought about
